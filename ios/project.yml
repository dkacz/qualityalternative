name: QualityAlternative
options:
  bundleIdPrefix: com.qualityalternative
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.5.0-ios-alpha
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
packages: {}
targets:
  QualityAlternative:
    type: application
    platform: iOS
    sources:
      - path: QualityAlternative
    resources:
      - path: QualityAlternative/Resources
    dependencies:
      - target: QualityAlternativeShieldConfiguration
        embed: true
      - target: QualityAlternativeShieldAction
        embed: true
    info:
      path: QualityAlternative/Info.plist
      properties:
        CFBundleDisplayName: Quality Alternative
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - newsreader.ttf
          - newsreader_italic.ttf
          - work_sans.ttf
          - jetbrains_mono.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qualityalternative.ios
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: QualityAlternative/QualityAlternative.entitlements
    scheme:
      testTargets:
        - QualityAlternativeTests
        - QualityAlternativeUITests
  QualityAlternativeShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: QualityAlternativeShieldConfiguration
      - path: QualityAlternative/Models.swift
      - path: QualityAlternative/ShieldState.swift
    info:
      path: QualityAlternativeShieldConfiguration/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qualityalternative.ios.shieldconfiguration
        PRODUCT_NAME: QualityAlternativeShieldConfiguration
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: QualityAlternativeShieldConfiguration/QualityAlternativeShieldConfiguration.entitlements
  QualityAlternativeShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: QualityAlternativeShieldAction
      - path: QualityAlternative/Models.swift
      - path: QualityAlternative/ShieldState.swift
    info:
      path: QualityAlternativeShieldAction/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qualityalternative.ios.shieldaction
        PRODUCT_NAME: QualityAlternativeShieldAction
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: QualityAlternativeShieldAction/QualityAlternativeShieldAction.entitlements
  QualityAlternativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QualityAlternativeTests
    dependencies:
      - target: QualityAlternative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qualityalternative.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  QualityAlternativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: QualityAlternativeUITests
    dependencies:
      - target: QualityAlternative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qualityalternative.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
